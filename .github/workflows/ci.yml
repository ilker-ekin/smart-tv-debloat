# Checks that protect users' TVs. No job talks to a real TV: the tests use the mock adb in tests/mock-adb.
# Style-only checks (PSScriptAnalyzer, yamllint) run locally; see CONTRIBUTING.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Package list, Python tests, shellcheck, bash tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      # Fails if a denylisted package is offered for removal, packages.tsv is stale,
      # or the denylist copied into the scripts drifts from packages.yaml.
      - run: python tools/packages.py check
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: shellcheck scripts/*.sh tests/mock-adb/adb tests/test_debloat.sh
      - run: bash tests/test_debloat.sh

  bash-macos:
    name: Bash tests on macOS (bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # /bin/bash is Apple's bash 3.2, what users have. The tests run the scripts with the same bash.
      - run: /bin/bash --version
      - run: /bin/bash tests/test_debloat.sh

  pester-windows:
    name: PowerShell tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5+
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run Pester
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
