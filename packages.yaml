  - {package: com.spotify.tv.android,  name: Spotify,     description: "", tier: 3, risk: safe, breaks: "", verified_on: []}

# Scripts must refuse these even if someone adds them above.
denylist:
  - com.google.android.apps.tv.launcherx      # Home screen
  - com.google.android.tungsten.setupwraith   # Setup; breaks Home on some firmware
  - com.google.android.gms
  - com.google.android.gsf
  - com.android.vending                       # Play Store
  - com.google.android.webview
  - com.google.android.apps.mediashell        # Chromecast built-in
  - com.android.providers.tv                  # Live TV channel DB
  - com.tcl.tv                                # Live TV
  - com.tcl.tvinput
  - com.tcl.system.server
  - com.tcl.settings
  - com.tcl.dashboard                         # Quick settings panel
  - com.tcl.partnercustomizer
  - com.tcl.providers.config
  - com.tcl.keyhelp
  - com.tcl.autopair                          # Remote pairing
  - com.tcl.micmanager                        # Remote mic
  - com.tcl.ui_mediaCenter                    # USB media
  - com.tcl.miracast
  - com.tcl.ttvs
  - com.tcl.suspension
  - com.tcl.factory.view
  - com.tcl.initsetup
  - com.tcl.useragreement
  - com.tvos
  - com.android.systemui
  - com.android.tv.settings
