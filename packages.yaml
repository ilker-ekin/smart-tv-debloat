  - package: com.google.android.tvrecommendations
    name: TV recommendations service
    description: "TODO(device): purpose unconfirmed on this firmware"
    tier: 3
    risk: caution
    breaks: "TODO(device): check that home-screen rows still load"
    verified_on: []

  # Third-party apps preinstalled by region; remove the ones you don't use.
  # verified_on = removed on that TV without side effects. [] = kept on the reference TV.
  - {package: com.disney.disneyplus,   name: Disney+,     description: "", tier: 3, risk: safe, breaks: "", verified_on: [G07_4K_GB_NF]}
  - {package: com.dsmart.blu.android,  name: D-Smart BLU, description: "", tier: 3, risk: safe, breaks: "", verified_on: [G07_4K_GB_NF]}
  - {package: tv.wuaki.apptv,          name: Rakuten TV,  description: "", tier: 3, risk: safe, breaks: "", verified_on: [G07_4K_GB_NF]}
