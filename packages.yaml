# Single source of truth for what the scripts offer to remove.
#
# Fields (all required; use "" or [] when empty):
#   package      Android package name
#   name         human name
#   description  what it is ("TODO(device)" if unconfirmed)
#   tier         1 = safe for almost everyone, 2 = probably safe, test after,
#                3 = user choice (scripts ALWAYS prompt, even with --yes)
#   risk         safe | caution | breaks-feature
#   breaks       what stops working after removal ("" = nothing known)
#   verified_on  device ids (see `devices`) where removal was done and the TV kept working.
#                [] = not verified on any device yet.
#
# Never add anything from the DENYLIST at the bottom. The scripts refuse
# denylisted packages in code, and `python tools/packages.py check` fails CI.
#
# After editing, regenerate the bash-readable copy:
#   python tools/packages.py gen

schema_version: 1

devices:
  - id: G07_4K_GB_NF
    platform: Android TV 11
    build: RP1A.200622.001/AR17
    ram: 2 GB

packages:
  # ---------- Tier 1: TCL bloat ----------
  - package: com.tcl.guard
    name: TCL Guard
    description: "'Cleaner' app; runs in background, Android already manages memory"
    tier: 1
    risk: safe
    breaks: ""
    verified_on: [G07_4K_GB_NF]
  - package: com.tcl.esticker
    name: E-Sticker
    description: Store demo overlay
    tier: 1
    risk: safe
    breaks: ""
    verified_on: [G07_4K_GB_NF]
